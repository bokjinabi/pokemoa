<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>화면 캡처용 (임시)</title>
<style>
  html, body { margin: 0; background: #eef2f8; }
  body { padding: 16px; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; }
  h2 { margin: 0 0 6px; font-size: 13px; color: #1b2a4a; }
  .frame { background: #fff; border: 1px solid #d7dfea; border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
  .f1440 { width: 1440px; height: 900px; }
  .f390 { width: 390px; height: 844px; }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div id="wrap1440">
    <h2>desktop 1440 × 900</h2>
    <div class="frame f1440"><iframe id="d" src="https://moa-kr.github.io/pokemoa/#map" title="desktop 1440"></iframe></div>
  </div>
  <div id="wrap390">
    <h2>mobile 390 × 844</h2>
    <div class="frame f390"><iframe id="m" src="https://moa-kr.github.io/pokemoa/#map" title="mobile 390"></iframe></div>
  </div>
</body>
</html>
